<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}LibraryMS{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success"><div class="container"><a class="navbar-brand" href="{{ url_for('home') }}">LibraryMS</a><div class="navbar-nav"><a class="nav-link {% if request.endpoint=='home' %}active fw-bold{% endif %}" href="{{ url_for('home') }}">Trang chủ</a><a class="nav-link {% if request.endpoint in ['books','book_detail'] %}active fw-bold{% endif %}" href="{{ url_for('books') }}">Sách</a></div></div></nav>
<main class="container py-4">{% block content %}{% endblock %}</main><footer class="border-top text-center text-muted p-3">LibraryMS v0.2 · Flask &amp; Jinja2</footer></body></html>
