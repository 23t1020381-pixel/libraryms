{% macro status_badge(available) -%}
{% if available %}<span class="badge text-bg-success">Sẵn sàng</span>{% else %}<span class="badge text-bg-secondary">Đang mượn</span>{% endif %}
{%- endmacro %}
{% macro book_card(book) -%}
<div class="card h-100 book-card"><div class="card-body d-flex flex-column"><div class="d-flex justify-content-between gap-2"><span class="badge text-bg-light">{{ book.category }}</span>{{ status_badge(book.available) }}</div><h2 class="h5 mt-3">{{ book.title }}</h2><p class="text-muted mb-1">{{ book.author }}</p><p class="small">Năm xuất bản: {{ book.year }}</p><a class="btn btn-outline-success mt-auto" href="{{ url_for('book_detail',book_id=book.id) }}">Xem chi tiết</a></div></div>
{%- endmacro %}
